name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest

    strategy:
      # Both versions get reported rather than the run stopping at the first
      # failure: "it breaks on the old one" and "it breaks on both" are
      # different problems and it is worth knowing which without a second push.
      fail-fast: false
      matrix:
        include:
          # What the deploy box runs. This pairing is the whole reason there is
          # a matrix: development happens on a much newer Elixir, so a feature
          # using anything newer than 1.18 compiles cleanly here and then fails
          # on the server, where nobody finds out until a deploy.
          - elixir: "1.18"
            otp: "27"
            primary: false
          # What the project is developed on.
          - elixir: "1.20"
            otp: "28"
            primary: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        # Without this the first query races the database coming up.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      # config/test.exs reads these, so the service needs no other wiring.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # Keyed on the lock file and the exact toolchain: a build directory from
      # another Elixir is not reusable and restoring one produces failures that
      # look like code problems.
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      # The four checks mix precommit runs, in the forms that fail rather than
      # fix. `mix format` and `deps.unlock --unused` both edit files, which in
      # CI means a green run on a tree nobody has actually tidied.
      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Test
        run: mix test

  tracker:
    name: Tracker JavaScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # These two ship to customers' pages as plain files — no bundler, no
      # transpiler, nothing that would have parsed them first. A syntax error
      # reaches production silently and takes the whole tag with it, so the
      # cheapest possible check is worth having on every push.
      - name: Parse the tracker and the live panel
        run: |
          node --check priv/tracker/wa.js
          node --check priv/tracker/live-proof.js

  assets:
    name: Assets build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "28"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            assets/node_modules
          key: ${{ runner.os }}-assets-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get

      # The same three tasks a deploy runs — tailwind, esbuild, phx.digest — so
      # a broken Tailwind config, a bad @source glob or an esbuild failure is
      # found here rather than by the deploy that serves an unstyled page.
      #
      # Left in dev on purpose: the prod environment evaluates runtime.exs,
      # which raises without DATABASE_URL and SECRET_KEY_BASE, and handing CI
      # production secrets to compile some CSS is a bad trade. The three tasks
      # are the same either way.
      - name: Build assets the way deploy does
        run: |
          mix assets.setup
          mix assets.deploy
